<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Namespace — Viberary</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/stylecheat.css" />
  <link rel="stylesheet" href="/css/blueprint.css" />
  <script async src="https://accounts.google.com/gsi/client"></script>

  <script>
    // The Worker serves this page at /<namespace>, a path vibe would derive no
    // manifest from, so it is told where the manifest lives.
    window.__MANIFEST__ = '/vibe-hyperspeed/namespace.html.manifest.js';
  </script>

  <script type="module">
    import boot from '/js/boot.js';
    import { load, state } from '/js/namespace.js';

    boot(state, load);
  </script>
</head>

<body stylecheat vibe-fouc>
  <component src="/components/Layout.html">
    <box main>
      <h1>@[namespace]</h1>
      <p lead max-w-160>Every component published under <code>@[namespace]/</code>.</p>
      <!-- if $.owns() && !loading && !components.length -->
      <button tertiary onclick="$.doubt()"><icon trash></icon>Delete namespace</button>
      <!-- /if -->
    </box>

    <sticky grid locked auto-shadow>
      <divider></divider>
      <crow left g-6 wrap w-full>
        <label f-1>
          <input type="search" placeholder="Search components" value="@[query]"
            oninput="$.query = this.value; $.filter()" />
        </label>

        <crow wrap>
          <span text-muted>Auto tags</span>
          <!-- each filters.auto as name -->
          <button tertiary active="@[tag === name]" onclick="$.pick('@[name]')">@[name]</button>
          <!-- /each -->
          <span text-muted>User tags</span>
          <!-- each filters.user as name -->
          <button tertiary active="@[tag === name]" onclick="$.pick('@[name]')">@[name]</button>
          <!-- /each -->
        </crow>
      </crow>
    </sticky>

    <box>
      <!-- if loading -->
      <crow w-full py="12" text-muted>Loading the namespace…</crow>
      <!-- else -->
      <!-- if matches.length -->
      <component src="/components/Catalogue.html" items="@[matches]"></component>
      <!-- else -->
      <crow w-full py="12" text-muted>
        <!-- if query -->Nothing matches “@[query]”.<!-- else -->No components published in @[namespace] yet.<!-- /if -->
      </crow>
      <!-- /if -->
      <!-- /if -->
    </box>

    <dialog removal>
      <card w="120" g-4 p-6>
        <h6>Delete @[namespace]</h6>
        <p>Nothing is published under @[namespace], so it can still be deleted. Are you sure?</p>
        <!-- if failure -->
        <p text-red>@[failure]</p>
        <!-- /if -->
        <crow right g-2 w-full>
          <button tertiary onclick="$.keep()">Cancel</button>
          <button primary onclick="$.remove()">Delete namespace</button>
        </crow>
      </card>
    </dialog>
  </component>
</body>

</html>
