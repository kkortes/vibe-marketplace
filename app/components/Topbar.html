<sticky grid locked auto-shadow>
  <crow justify-between g-4 h-12 w-full>
    <a href="/" secondary><strong>Viberary</strong></a>
    <nav flex f-1 sm:hide>
      <a href="/" class="button" tertiary active="@[['/', '/index.html'].includes(path)]">Browse</a>
      <a href="/publish.html" class="button" tertiary active="@[path === '/publish.html']">Publish</a>
      <a href="https://vibe.korte.kim" target="_blank" rel="noopener" class="button" tertiary>
        Vibe docs
        <svg width="0.875em" height="0.875em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg>
      </a>
    </nav>
    <crow g-2>
      <button tertiary title="Switch theme" onclick="$.darkMode = !$.darkMode">
        <!-- if darkMode --><icon light></icon><!-- else --><icon dark></icon><!-- /if -->
      </button>
      <!-- if authReady -->
      <!-- if user -->
      <user-menu position="relative">
        <!-- if userMenuOpen --><user-backdrop position="fixed" t-0 r-0 b-0 l-0 onclick="$.userMenuOpen = false"></user-backdrop><!-- /if -->
        <button primary w="12" h="12" p-0 onclick="$.userMenuOpen = !$.userMenuOpen">
          <strong>@[user.name[0].toUpperCase()]</strong>
        </button>
        <!-- if userMenuOpen -->
        <card position="absolute" t="12" r-0 w="52" p-2 g-1>
          <strong px-2 py-1>@[user.name]</strong>
          <span sm text-muted px-2>@[user.email]</span>
          <hr />
          <button primary w-full mt-1 onclick="$.signOut()">Sign out</button>
        </card>
        <!-- /if -->
      </user-menu>
      <!-- else -->
      <button primary w="24" onclick="$.signIn()">Sign in</button>
      <!-- /if -->
      <!-- else -->
      <span flex w="12" h="12" bg-slate animate-pulse></span>
      <!-- /if -->
    </crow>
  </crow>
</sticky>
