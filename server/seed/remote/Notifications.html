<script type="module">
  import component from '/node_modules/@ape-egg/vibe/component.js';
  component({});

  const DEFAULT_DURATION = 4000;
  const GAP = 14;
  const VISIBLE = 3;
  const SCALE_STEP = 0.05;
  const SWIPE_THRESHOLD = 60;

  let nextId = 0;
  const timers = new Map();
  const leaving = new Set();
  let paused = false;

  const list = () => (Array.isArray($.notifications) ? $.notifications : []);
  const setList = (next) => {
    $.notifications = next;
  };

  const scheduleLeave = (id, ms) => {
    const startedAt = Date.now();
    const handle = setTimeout(() => {
      timers.delete(id);
      beginLeave(id);
    }, ms);
    timers.set(id, { handle, remaining: ms, startedAt });
  };

  const beginLeave = (id) => {
    if (leaving.has(id)) return;
    leaving.add(id);
    const t = timers.get(id);
    if (t?.handle) clearTimeout(t.handle);
    timers.delete(id);
    setList(list().map((n) => (n.id === id ? { ...n, leaving: true } : n)));
  };

  const finalizeLeave = (id) => {
    if (!leaving.has(id)) return;
    leaving.delete(id);
    setList(list().filter((n) => n.id !== id));
  };

  const push = (type, title, opts = {}) => {
    if (title instanceof Error) title = title.message;
    if (title == null || title === '') return;
    const id = opts.id ?? ++nextId;
    const duration = opts.duration ?? (type === 'loading' ? Infinity : DEFAULT_DURATION);
    const entry = {
      id,
      type,
      title: String(title),
      description: opts.description || null,
      icon: opts.icon || null,
      equipment: opts.equipment || null,
    };
    const current = list();
    const existing = current.find((n) => n.id === id);
    setList(existing ? current.map((n) => (n.id === id ? entry : n)) : [...current, entry]);

    const prev = timers.get(id);
    if (prev?.handle) clearTimeout(prev.handle);
    timers.delete(id);
    leaving.delete(id);
    if (duration !== Infinity) {
      if (paused) timers.set(id, { handle: null, remaining: duration, startedAt: Date.now() });
      else scheduleLeave(id, duration);
    }
    return id;
  };

  const notify = (title, opts) => push('default', title, opts);
  notify.success = (t, o) => push('success', t, o);
  notify.error = (t, o) => push('error', t, o);
  notify.warning = (t, o) => push('warning', t, o);
  notify.info = (t, o) => push('info', t, o);
  notify.loading = (t, o) => push('loading', t, o);
  notify.dismiss = (id) => {
    if (id == null) for (const n of list()) beginLeave(n.id);
    else beginLeave(id);
  };
  notify.promise = (promise, msgs) => {
    const loadingMsg = typeof msgs.loading === 'function' ? msgs.loading() : msgs.loading;
    const id = push('loading', loadingMsg);
    Promise.resolve(promise).then(
      (v) =>
        push('success', typeof msgs.success === 'function' ? msgs.success(v) : msgs.success, {
          id,
        }),
      (e) => push('error', typeof msgs.error === 'function' ? msgs.error(e) : msgs.error, { id }),
    );
    return id;
  };
  window.notify = notify;

  window.setNotifyPos = ({ up, down, left, right }) => {
    $.notifyUp = !!up;
    $.notifyDown = !!down;
    $.notifyLeft = !!left;
    $.notifyRight = !!right;
  };

  const pauseTimers = () => {
    if (paused) return;
    paused = true;
    for (const [, t] of timers) {
      if (!t.handle) continue;
      clearTimeout(t.handle);
      t.remaining = Math.max(0, t.remaining - (Date.now() - t.startedAt));
      t.handle = null;
    }
  };
  const resumeTimers = () => {
    if (!paused) return;
    paused = false;
    for (const [id, t] of timers) {
      if (t.handle) continue;
      scheduleLeave(id, t.remaining);
    }
  };

  window.onNotifyEnter = (vp) => {
    pauseTimers();
    vp.toggleAttribute('expanded', true);
    requestAnimationFrame(updateLayout);
  };
  window.onNotifyLeave = (vp) => {
    resumeTimers();
    vp.toggleAttribute('expanded', false);
    requestAnimationFrame(updateLayout);
  };

  window.onNotifyAnimEnd = (notification) => {
    if (notification.leaving) finalizeLeave(notification.id);
  };

  const updateLayout = () => {
    document.querySelectorAll('notifications-viewport').forEach((vp) => {
      const hit = vp.querySelector(':scope > notification-hit');
      if (!hit) return;
      const cards = [...hit.querySelectorAll(':scope > notification-card')];
      const n = cards.length;
      const heights = cards.map((c) => c.offsetHeight || 64);
      cards.forEach((card, i) => {
        const frontI = n - 1 - i;
        let exp = 0;
        for (let j = 1; j <= frontI; j++) exp += heights[n - j] + GAP;
        card.style.setProperty('--front-i', frontI);
        card.style.setProperty('--col-y', `${frontI * GAP}px`);
        card.style.setProperty('--col-scale', `${1 - frontI * SCALE_STEP}`);
        card.style.setProperty('--exp-y', `${exp}px`);
        card.style.setProperty('--z', String(1000 - frontI));
        card.toggleAttribute('hidden-stack', frontI >= VISIBLE);
      });
      const frontH = heights[n - 1] || 0;
      const peek = Math.min(VISIBLE - 1, Math.max(0, n - 1)) * GAP;
      const expandedH = heights.reduce((a, h, i) => a + h + (i > 0 ? GAP : 0), 0);
      const hitH = vp.hasAttribute('expanded') ? Math.max(frontH + peek, expandedH) : frontH + peek;
      hit.style.setProperty('--hit-h', `${hitH}px`);
    });
  };

  const ro = new ResizeObserver(() => requestAnimationFrame(updateLayout));
  const observed = new WeakSet();
  const attach = () => {
    document.querySelectorAll('notification-card').forEach((c) => {
      if (observed.has(c)) return;
      observed.add(c);
      ro.observe(c);
    });
  };
  new MutationObserver(() => {
    attach();
    requestAnimationFrame(updateLayout);
  }).observe(document.body, { childList: true, subtree: true });
  requestAnimationFrame(() => {
    attach();
    updateLayout();
  });

  window.onNotifyPointerDown = (el, ev) => {
    if (ev.button !== 0) return;
    if (ev.target.closest('button, a, input, textarea, select')) return;
    el.setPointerCapture(ev.pointerId);
    el._drag = { x: ev.clientX, y: ev.clientY, dx: 0, dy: 0 };
    el.toggleAttribute('dragging', true);
  };
  const dragAxis = (vp) => {
    const hx = vp.hasAttribute('right') ? 1 : vp.hasAttribute('left') ? -1 : 0;
    if (hx !== 0) return { ax: hx, ay: 0 };
    const vy = vp.hasAttribute('down') ? 1 : vp.hasAttribute('up') ? -1 : 0;
    return { ax: 0, ay: vy };
  };

  window.onNotifyPointerMove = (el, ev) => {
    if (!el._drag) return;
    const dx = (el._drag.dx = ev.clientX - el._drag.x);
    const dy = (el._drag.dy = ev.clientY - el._drag.y);
    const { ax, ay } = dragAxis(el.closest('notifications-viewport'));
    let dragX, dragY;
    if (ax === 0 && ay === 0) {
      dragX = dx;
      dragY = dy;
    } else {
      dragX = ax === 0 ? 0 : ax * Math.max(0, ax * dx);
      dragY = ay === 0 ? 0 : ay * Math.max(0, ay * dy);
    }
    el.style.setProperty('--drag-x', `${dragX}px`);
    el.style.setProperty('--drag-y', `${dragY}px`);
  };
  window.onNotifyPointerUp = (el, ev, notification) => {
    if (!el._drag) return;
    const { dx, dy } = el._drag;
    el._drag = null;
    try {
      el.releasePointerCapture(ev.pointerId);
    } catch {}

    const { ax, ay } = dragAxis(el.closest('notifications-viewport'));
    const dismiss =
      ax === 0 && ay === 0
        ? Math.hypot(dx, dy) > SWIPE_THRESHOLD
        : dx * ax + dy * ay > SWIPE_THRESHOLD;
    if (dismiss) {
      beginLeave(notification.id);
    } else {
      el.toggleAttribute('dragging', false);
      el.style.removeProperty('--drag-x');
      el.style.removeProperty('--drag-y');
    }
  };
</script>

<notifications-viewport
  up="@[up]"
  down="@[down]"
  left="@[left]"
  right="@[right]"
  style="--offset-x: @[(offsetX || 0)]px; --offset-y: @[(offsetY || 0)]px"
>
  <notification-hit
    onmouseenter="onNotifyEnter(this.parentElement)"
    onmouseleave="onNotifyLeave(this.parentElement)"
  >
    <!-- each notifications as notification (notification.id) -->
      <notification-card
        @[notification.type]
        leaving="@[notification.leaving]"
        onanimationend="onNotifyAnimEnd(notification)"
        onpointerdown="onNotifyPointerDown(this, event)"
        onpointermove="onNotifyPointerMove(this, event)"
        onpointerup="onNotifyPointerUp(this, event, notification)"
        onpointercancel="onNotifyPointerUp(this, event, notification)"
      >
        <notification-icon @[notification.type] has-icon="@[notification.icon]">
          <!-- if notification.icon === 'crystal' -->
            <coin>
              <stack>
                <icon crystal back></icon>
                <icon crystal coin-platinum></icon>
              </stack>
            </coin>
          <!-- /if -->
          <!-- if notification.icon && notification.icon !== 'crystal' -->
            <icon class="@[notification.icon]"></icon>
          <!-- /if -->
          <!-- if !notification.icon && notification.type === 'success' -->
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="9" fill="currentColor" />
              <path
                d="M6 10.2l2.6 2.6L14 7.4"
                fill="none"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          <!-- /if -->
          <!-- if !notification.icon && notification.type === 'error' -->
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="9" fill="currentColor" />
              <path
                d="M10 5.5v5.2"
                fill="none"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle cx="10" cy="14" r="1.1" fill="white" />
            </svg>
          <!-- /if -->
          <!-- if !notification.icon && notification.type === 'warning' -->
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M10 2L18.5 17.2H1.5z" fill="currentColor" />
              <path
                d="M10 8v4"
                fill="none"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle cx="10" cy="14.6" r="1.1" fill="white" />
            </svg>
          <!-- /if -->
          <!-- if !notification.icon && notification.type === 'info' -->
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="9" fill="currentColor" />
              <path
                d="M10 9.4v5.2"
                fill="none"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle cx="10" cy="6" r="1.1" fill="white" />
            </svg>
          <!-- /if -->
          <!-- if !notification.icon && notification.type === 'loading' -->
            <svg viewBox="0 0 20 20" aria-hidden="true" animate-spin>
              <circle
                cx="10"
                cy="10"
                r="7.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                opacity="0.2"
              />
              <path
                d="M17.5 10a7.5 7.5 0 0 0-7.5-7.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          <!-- /if -->
        </notification-icon>
        <notification-body>
          <notification-title>
            <!-- if notification.equipment -->
              <component
                src="/components/EquipmentLink.html"
                name="@[notification.equipment.name]"
                element="@[notification.equipment.element]"
              ></component>
            <!-- /if -->
            @[notification.title]
          </notification-title>
          <!-- if notification.description -->
            <notification-desc>@[notification.description]</notification-desc>
          <!-- /if -->
        </notification-body>
      </notification-card>
    <!-- /each -->
  </notification-hit>
</notifications-viewport>

<style>
  notifications-viewport {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    display: block;
    --width: calc(var(--unit) * 89);
    --margin-x: 0px;
    --margin-y: 0px;
    --left: 50%;
    --right: auto;
    --top: auto;
    --bottom: 0px;
    --tx: -50%;
    --ty: 0px;
    --sign: -1;
    --enter-x: 0%;
    --enter-y: 120%;
    --leave-x: 0%;
    --leave-y: 120%;
    --transform-origin: center bottom;
    --card-left: 50%;
    --card-right: auto;
    --card-tx: -50%;

    --notify-bg: var(--tooltip-surface, var(--card, oklch(1 0 0)));
    --notify-fg: var(--foreground, oklch(0.15 0 0));
    --notify-desc: var(--muted-foreground, oklch(0.45 0 0));
    --notify-border: var(--border, oklch(0.92 0 0));
    --notify-shadow: 0 calc(var(--unit) * 1) calc(var(--unit) * 4) -1px oklch(0 0 0 / 0.1);
    --notify-success: var(--hue-green, oklch(0.6 0.17 142));
    --notify-error: var(--destructive, oklch(0.55 0.2 25));
    --notify-warning: var(--hue-yellow, oklch(0.78 0.16 90));
    --notify-info: var(--hue-blue, oklch(0.55 0.18 250));
    --notify-loading: var(--muted, oklch(0.5 0.01 0));
  }

  @media (min-width: 769px) {
    notifications-viewport {
      --left: 50%;
      --right: auto;
      --top: 50%;
      --bottom: auto;
      --tx: -50%;
      --ty: -50%;
      --sign: 1;
      --enter-x: 0%;
      --enter-y: 0%;
      --leave-x: 0%;
      --leave-y: 0%;
      --transform-origin: center center;
    }

    notifications-viewport {
      --margin-x: var(--offset-x, 0px);
      --margin-y: var(--offset-y, 0px);
    }

    notifications-viewport[left]:not([right]) {
      --left: var(--margin-x);
      --right: auto;
      --tx: 0px;
      --enter-x: -120%;
      --leave-x: -120%;
      --transform-origin: left center;
      --card-left: 0;
      --card-right: auto;
      --card-tx: 0px;
    }
    notifications-viewport[right]:not([left]) {
      --left: auto;
      --right: var(--margin-x);
      --tx: 0px;
      --enter-x: 120%;
      --leave-x: 120%;
      --transform-origin: right center;
      --card-left: auto;
      --card-right: 0;
      --card-tx: 0px;
    }
    notifications-viewport[up]:not([down]) {
      --top: var(--margin-y);
      --bottom: auto;
      --ty: 0px;
      --sign: 1;
      --enter-y: -120%;
      --leave-y: -120%;
      --transform-origin: center top;
    }
    notifications-viewport[down]:not([up]) {
      --top: auto;
      --bottom: var(--margin-y);
      --ty: 0px;
      --sign: -1;
      --enter-y: 120%;
      --leave-y: 120%;
      --transform-origin: center bottom;
    }

    notifications-viewport[left]:not([right]),
    notifications-viewport[right]:not([left]) {
      --enter-y: 0%;
      --leave-y: 0%;
    }

    notifications-viewport[up][left] {
      --transform-origin: left top;
    }
    notifications-viewport[up][right] {
      --transform-origin: right top;
    }
    notifications-viewport[down][left] {
      --transform-origin: left bottom;
    }
    notifications-viewport[down][right] {
      --transform-origin: right bottom;
    }
  }

  notification-hit {
    position: absolute;
    display: block;
    left: var(--left);
    right: var(--right);
    top: var(--top);
    bottom: var(--bottom);
    width: var(--width);
    max-width: calc(100vw - var(--margin-x) * 2);
    height: var(--hit-h, 0px);
    transform: translate(var(--tx), var(--ty));
    pointer-events: auto;
    transition: height 400ms cubic-bezier(0.32, 0.72, 0, 1);
  }

  notification-card {
    position: absolute;
    left: var(--card-left);
    right: var(--card-right);
    width: max-content;
    max-width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: flex-start;
    gap: calc(var(--unit) * 3);
    padding: calc(var(--unit) * 4);
    background: var(--notify-bg);
    color: var(--notify-fg);
    border: 1px solid var(--notify-border);
    border-radius: var(--radius);
    box-shadow: var(--notify-shadow);
    font-family: var(--font-sans);
    font-size: calc(var(--unit) * 3.5);
    line-height: 1.4;
    touch-action: pan-y;
    user-select: none;
    cursor: grab;
    transform-origin: var(--transform-origin);
    transform: translate(
        calc(var(--card-tx) + var(--drag-x, 0px)),
        calc(var(--col-y, 0px) * var(--sign) + var(--drag-y, 0px))
      )
      scale(var(--col-scale, 1));
    transition:
      transform 400ms cubic-bezier(0.32, 0.72, 0, 1),
      opacity 200ms ease;
    z-index: var(--z, 1);
    animation: notify-in 400ms cubic-bezier(0.21, 1.02, 0.73, 1) backwards;
  }

  notifications-viewport[down]:not([up]) notification-card {
    top: auto;
    bottom: 0;
  }
  notifications-viewport:not([down]) notification-card,
  notifications-viewport[up] notification-card {
    top: 0;
  }

  notifications-viewport[expanded] notification-card {
    transform: translate(
        calc(var(--card-tx) + var(--drag-x, 0px)),
        calc(var(--exp-y, 0px) * var(--sign) + var(--drag-y, 0px))
      )
      scale(1);
  }

  notification-card[dragging] {
    transition: none;
    cursor: grabbing;
  }

  notification-card[hidden-stack] {
    opacity: 0;
    pointer-events: none;
  }
  notifications-viewport[expanded] notification-card[hidden-stack] {
    opacity: 1;
    pointer-events: auto;
  }

  notification-card[leaving] {
    animation: notify-out 280ms cubic-bezier(0.4, 0, 1, 1) forwards;
  }

  @keyframes notify-in {
    from {
      opacity: 0;
      transform: translate(calc(var(--card-tx) + var(--enter-x)), var(--enter-y)) scale(0.94);
    }
  }

  @keyframes notify-out {
    to {
      opacity: 0;
      transform: translate(calc(var(--card-tx) + var(--leave-x)), var(--leave-y)) scale(0.9);
    }
  }

  notification-icon {
    flex: none;
    width: calc(var(--unit) * 5);
    height: 1lh;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  notification-icon svg {
    width: 100%;
    height: calc(var(--unit) * 5);
    display: block;
  }
  notification-icon[success] {
    color: var(--notify-success);
  }
  notification-icon[error] {
    color: var(--notify-error);
  }
  notification-icon[warning] {
    color: var(--notify-warning);
  }
  notification-icon[info] {
    color: var(--notify-info);
  }
  notification-icon[loading] {
    color: var(--notify-loading);
  }
  notification-icon[default]:not([has-icon]) {
    display: none;
  }

  notification-icon > icon,
  notification-icon > coin {
    font-size: calc(var(--unit) * 5);
  }

  notification-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: calc(var(--unit) * 1);
  }

  notification-title {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: calc(var(--unit) * 1.5);
    font-weight: 500;
    color: var(--notify-fg);
    word-wrap: break-word;
  }

  notification-desc {
    font-size: calc(var(--unit) * 3.25);
    color: var(--notify-desc);
    word-wrap: break-word;
  }
</style>
