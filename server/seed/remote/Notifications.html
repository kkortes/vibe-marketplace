<script type="module">
  import component from '@ape-egg/vibe/component';

  const titles = {
    error: 'Ops, something went wrong!',
    info: 'Did you know?',
    success: 'Good news',
    warning: 'Heads up',
  };

  let count = 0;
  let animations = [];

  const instance = Math.random().toString(36).slice(2);
  const id = component({
    instance,
    queue: [],
    hover: (enter) => animations.forEach((animation) => animation[enter ? 'pause' : 'play']()),
  });

  const stack = () => document.querySelector(`notifications-stack[data-instance="${instance}"]`);

  const dismiss = () => {
    const first = stack().firstElementChild;
    if (!first || animations.length) return;

    const timing = { delay: 3000, duration: 600, easing: 'ease' };
    animations = [
      stack().animate({ transform: `translateY(-${first.offsetHeight}px)` }, timing),
      first.animate({ opacity: 0 }, timing),
    ];
    animations[0].onfinish = () => {
      animations = [];
      $[id].queue = $[id].queue.slice(1);
    };
  };

  const notify = ({ detail: { type, message } }) => {
    const text = message.replace('Error: ', '');
    const capitalised = text[0].toUpperCase() + text.slice(1);
    if ($[id].queue.some((notification) => notification.message === capitalised)) return;
    $[id].queue = [...$[id].queue, { id: ++count, type, title: titles[type], message: capitalised }];
  };

  addEventListener('notify', notify);
  $.on('afterUpdate', dismiss);
  $.on('unmount', () => removeEventListener('notify', notify));
</script>

<notifications-root role="status">
  <notifications-stack data-instance="@[this.instance]" onmouseenter="this.hover(true)" onmouseleave="this.hover(false)">
    <!-- each this.queue as notification -->
    <notification-item pb-2>
      <card p-3 pr-5>
        <crow left g-2>
          <!-- if notification.type === 'error' -->
          <crow circle w-8 bg-red text-red><icon cross></icon></crow>
          <!-- else if notification.type === 'warning' -->
          <crow circle w-8 bg-orange text-orange><icon triangle-alert></icon></crow>
          <!-- else if notification.type === 'success' -->
          <crow circle w-8 bg-green text-green><icon checkmark></icon></crow>
          <!-- else -->
          <crow circle w-8 bg-blue text-blue><icon bell></icon></crow>
          <!-- /if -->
          <crow vertical left max-w-72>
            <b>@[notification.title]</b>
            <span text-muted>@[notification.message]</span>
          </crow>
        </crow>
      </card>
    </notification-item>
    <!-- /each -->
  </notifications-stack>
</notifications-root>

<style>
  notifications-root {
    position: fixed;
    top: calc(var(--unit, 4px) * 8);
    right: calc(var(--unit, 4px) * 2);
    z-index: 1;
    pointer-events: none;
  }

  notifications-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  notification-item {
    pointer-events: auto;
    transition: translate 300ms ease, opacity 300ms ease;

    @starting-style {
      translate: 50px;
      opacity: 0;
    }
  }
</style>
