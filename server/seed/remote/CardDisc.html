<card-disc sm="@[sm]">
  <component
    src="/components/Mugshot.html"
    image="@[image]"
    x="@[x]"
    y="@[y]"
    zoom="@[zoom || 5]"
    name="@[name]"
  >
  </component>
</card-disc>

<style>
  card-disc {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: var(--card);
    box-shadow:
      inset 0 0 0 calc(var(--unit) * 0.75) var(--sheen-2),
      inset 0 0 0 1px var(--scrim-3),
      0 calc(var(--unit) * 1.5) calc(var(--unit) * 3) calc(var(--unit) * -0.5) var(--scrim-2);
    transform: rotate(calc(-1 * var(--rot, 0deg)));
    transition:
      transform 160ms cubic-bezier(0.34, 1.45, 0.6, 1),
      box-shadow 160ms ease,
      filter 250ms ease,
      opacity 250ms ease;
  }

  card-disc[sm] {
    width: calc(var(--unit) * 12);
    height: calc(var(--unit) * 12);
  }
</style>
