<script type="module">
  import component from '@ape-egg/vibe/component';

  const instance = Math.random().toString(36).slice(2);
  const id = component({ instance, close: () => root().dispatchEvent(new Event('close')) });

  const root = () => document.querySelector(`overlay-slider[data-instance="${instance}"]`);

  const escape = ({ code }) =>
    code === 'Escape' && root().hasAttribute('open') && !root().hasAttribute('noescape') && $[id].close();

  addEventListener('keydown', escape);

  $.on('unmount', () => removeEventListener('keydown', escape));
</script>

<overlay-slider
  data-instance="@[this.instance]"
  open="@[open]"
  noescape="@[noescape]"
  onclose="$.open = false"
  onclick="(event.target.matches('overlay-slider, carousel, slides, slide') || event.currentTarget.contains(event.target.closest('[close]'))) && this.close()"
>
  <carousel>
    <slot></slot>
  </carousel>
</overlay-slider>

<style>
  overlay-slider {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    grid-template-rows: 80px 1fr 80px;
    place-items: center;
    background: rgb(0 0 0 / 0.1);
    box-shadow: inset 0 0 10vw rgb(0 0 0 / 0.5);
    backdrop-filter: blur(1px);
    opacity: 0;
    scale: 1.2;
    pointer-events: none;
    transition: opacity 200ms 75ms, scale 200ms 75ms;
  }

  overlay-slider[open] {
    opacity: 1;
    scale: 1;
    pointer-events: auto;
  }

  overlay-slider > carousel {
    --slide: min(320px, 90cqi);
    grid-row: 2;
  }

  overlay-slider slides {
    gap: 40px;
    padding: 0 calc(50cqi - var(--slide) / 2);
  }

  overlay-slider slides > slide {
    min-width: var(--slide);
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
  }

  @media (max-width: 768px) {
    overlay-slider { grid-template-rows: calc(var(--unit) * 8) 1fr calc(var(--unit) * 8); }
    overlay-slider > carousel { --slide: 70cqi; }
  }
</style>
