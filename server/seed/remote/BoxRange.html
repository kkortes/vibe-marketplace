<script type="module">
  window.boxRangeCells = (min, max) =>
    Array.from({ length: Number(max) - Number(min) + 1 }, (_, i) => Number(min) + i);
</script>

<box-range>
  <!-- each boxRangeCells(min, max) as n (n) -->
    <box-cell filled="@[n <= value]" onclick="@[onchange](n)">@[n]</box-cell>
  <!-- /each -->
</box-range>
