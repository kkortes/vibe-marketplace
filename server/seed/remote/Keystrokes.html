<script type="module">
  import component from '@ape-egg/vibe/component';

  const ungated = ['enter', 'escape', 'shiftleft', 'shiftright'];

  const instance = Math.random().toString(36).slice(2);
  component({ instance });

  const root = () => document.querySelector(`keystrokes-root[data-instance="${instance}"]`);

  const toggle = (event) => {
    if (!(event instanceof KeyboardEvent)) return;

    const { type, code, metaKey, ctrlKey } = event;
    const key = code.toLowerCase();
    const keys = JSON.parse(root().dataset.keys);

    if (keys[key] && type === 'keydown') return;

    let map;
    if (metaKey || ctrlKey) map = Object.fromEntries(Object.keys(keys).map((name) => [name, false]));
    else if (key in keys && (!root().getAttribute('disabled') || ungated.includes(key)))
      map = { ...keys, [key]: type === 'keydown' };
    else return;

    root().dispatchEvent(new CustomEvent('change', { detail: map }));
  };

  addEventListener('keydown', toggle);
  addEventListener('keyup', toggle);

  $.on('unmount', () => {
    removeEventListener('keydown', toggle);
    removeEventListener('keyup', toggle);
  });
</script>

<keystrokes-root data-instance="@[this.instance]" data-keys="@[JSON.stringify(keys)]" disabled="@[disabled ? 'disabled' : '']" onchange="$.keys = event.detail">
  <!-- if debug -->
  <keystrokes-debug>@[JSON.stringify(keys, null, 2)]</keystrokes-debug>
  <!-- /if -->
</keystrokes-root>

<style>
  keystrokes-debug {
    position: fixed;
    right: 0;
    bottom: 0;
    z-index: 1;
    padding: 32px;
    background: #fff;
    color: #1f2937;
    font: 12px monospace;
    white-space: pre;
    pointer-events: none;
  }
</style>
