<crow pagination justify-between align-center g="2" w="full">
  <button tertiary sm disabled="@[page === 0]" onclick="@[prev]">Previous</button>
  <span text-sm text-muted>Page @[page + 1] of @[pageCount]</span>
  <button tertiary sm disabled="@[page >= pageCount - 1]" onclick="@[next]">Next</button>
</crow>
