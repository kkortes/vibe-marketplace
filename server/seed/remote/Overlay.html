<script type="module">
  import component from '@ape-egg/vibe/component';

  const instance = Math.random().toString(36).slice(2);
  const id = component({ instance, close: () => root().dispatchEvent(new Event('close')) });

  const root = () => document.querySelector(`overlay-root[data-instance="${instance}"]`);

  const escape = ({ code }) =>
    code === 'Escape' && root().hasAttribute('open') && !root().hasAttribute('noescape') && $[id].close();

  addEventListener('keydown', escape);

  $.on('unmount', () => removeEventListener('keydown', escape));
</script>

<overlay-root
  data-instance="@[this.instance]"
  open="@[open]"
  noescape="@[noescape]"
  onclose="$.open = false"
>
  <!-- if open -->
  <overlay-backdrop
    onclick="(event.target === event.currentTarget || event.target.closest('[close]:not(component)')) && this.close()"
  >
    <overlay-box>
      <component src="@[component]" props="@[props]" close="@[this.close]"></component>
    </overlay-box>
  </overlay-backdrop>
  <!-- /if -->
</overlay-root>

<style>
  overlay-backdrop {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    grid-template-rows: 80px 1fr 80px;
    place-items: center;
    overflow: hidden auto;
    background: rgb(0 0 0 / 0.2);
    box-shadow: inset 0 0 10vw rgb(0 0 0 / 0.5);
    backdrop-filter: blur(1px);
    transition: opacity 200ms 75ms, scale 200ms 75ms;

    @starting-style {
      opacity: 0;
      scale: 0.95;
    }
  }

  overlay-box {
    grid-row: 2;
    min-width: 700px;
    max-width: calc(100% - 96px);
  }

  @media (max-width: 768px) {
    overlay-backdrop { grid-template-rows: calc(var(--unit, 4px) * 8) 1fr calc(var(--unit, 4px) * 8); }
    overlay-box { min-width: calc(100% - 80px); max-width: calc(100% - calc(var(--unit, 4px) * 8)); }
  }
</style>
