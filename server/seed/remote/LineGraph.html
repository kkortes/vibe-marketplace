<script type="module">
  const escape = (text) =>
    String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

  const niceCeil = (value) => {
    const power = 10 ** Math.floor(Math.log10(value || 1));
    return ([1, 2, 2.5, 5, 10].find((candidate) => candidate * power >= value) || 10) * power;
  };

  const seriesColor = (i, count) =>
    `oklch(0.55 0.16 ${Math.round((i * 360) / Math.max(count, 1))})`;

  const grouped = (series) => series.some((s) => s.group != null);
  const colorOf = (series, s, i) =>
    grouped(series)
      ? seriesColor(s.group ?? i, Math.max(...series.map((x) => x.group ?? 0)) + 1)
      : seriesColor(i, series.length);

  window.lineGraphSvg = (series = [], percent) => {
    const W = 1000;
    const H = 460;
    const L = 76;
    const R = 24;
    const T = 20;
    const B = 48;
    const n = Math.max(...series.map((s) => s.values.length), 2);
    const maxY = niceCeil(Math.max(...series.flatMap((s) => s.values), 0.0001));
    const x = (i) => L + (i / (n - 1)) * (W - L - R);
    const y = (value) => T + (1 - value / maxY) * (H - T - B);
    const fmt = (value) =>
      percent ? `${Math.round(value * 100)}%` : `${Math.round(value * 100) / 100}`;

    const grid = Array.from({ length: 5 }, (_, i) => {
      const value = (maxY / 4) * i;
      return (
        `<line x1="${L}" y1="${y(value)}" x2="${W - R}" y2="${y(value)}" stroke="var(--scrim-1)" />` +
        `<text x="${L - 10}" y="${y(value) + 5}" text-anchor="end" fill="var(--muted-foreground)" font-size="15">${fmt(value)}</text>`
      );
    }).join('');

    const xAxis = [1, ...Array.from({ length: Math.floor(n / 5) }, (_, i) => (i + 1) * 5)]
      .filter((level) => level <= n)
      .map(
        (level) =>
          `<line x1="${x(level - 1)}" y1="${T}" x2="${x(level - 1)}" y2="${H - B}" stroke="var(--scrim-1)" />` +
          `<text x="${x(level - 1)}" y="${H - B + 24}" text-anchor="middle" fill="var(--muted-foreground)" font-size="15">${level}</text>`,
      )
      .join('');

    const lines = series
      .map((s, si) => {
        const color = colorOf(series, s, si);
        const stroke = s.border ? ' stroke="var(--foreground)" stroke-width="1"' : '';
        const points = s.values.map((value, i) => `${x(i)},${y(value)}`).join(' ');
        const dots = s.values
          .map(
            (value, i) =>
              `<circle cx="${x(i)}" cy="${y(value)}" r="5" fill="${color}"${stroke} data-label="${escape(`${s.name} — level ${i + 1}: ${fmt(value)}`)}" />`,
          )
          .join('');
        return `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" />${dots}`;
      })
      .join('');

    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${grid}${xAxis}${lines}</svg>`;
  };

  window.lineGraphLegend = (series = []) => {
    const W = 1000;
    const ROW = 26;
    const CHAR = 7.5;
    let x = 0;
    let row = 0;
    const items = series.map((s, si) => {
      const { name } = s;
      const color = colorOf(series, s, si);
      const stroke = s.border ? ' stroke="var(--foreground)" stroke-width="1"' : '';
      const width = 14 + 6 + name.length * CHAR + 26;
      if (x + width > W) {
        x = 0;
        row += 1;
      }
      const item =
        `<rect x="${x}" y="${row * ROW + 6}" width="14" height="14" rx="4" fill="${color}"${stroke} />` +
        `<text x="${x + 20}" y="${row * ROW + 18}" fill="var(--foreground)" font-size="14">${escape(name)}</text>`;
      x += width;
      return item;
    });
    const H = (row + 1) * ROW;
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${items.join('')}</svg>`;
  };

  window.chartDotHover = (event) => {
    const label = event.target.dataset?.label;
    if (label)
      showTooltip({ description: label, plain: true }, event.target, {
        direction: 'up',
        lock: true,
      });
  };
  window.chartDotOut = (event) => {
    if (event.target.dataset?.label) hideTooltip();
  };
</script>

<line-graph>
  <line-graph-legend>@[$.unsafe(lineGraphLegend(series))]</line-graph-legend>
  <line-graph-chart onmouseover="chartDotHover(event)" onmouseout="chartDotOut(event)">
    @[$.unsafe(lineGraphSvg(series, percent))]
  </line-graph-chart>
</line-graph>

<style>
  line-graph {
    display: flex;
    flex-direction: column;
    gap: calc(var(--unit) * 3);
    width: 100%;
  }

  line-graph-legend,
  line-graph-chart {
    display: block;
    width: 100%;
  }

  line-graph-legend svg,
  line-graph-chart svg {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
