  const OFFSET = 8;
  let currentAnchor = null;
  let currentLeave = null;

  const detach = () => {
    if (currentAnchor && currentLeave) {
      currentAnchor.removeEventListener('mouseleave', currentLeave);
    }
    currentAnchor = null;
    currentLeave = null;
  };

  const anchorPoint = (anchor, direction) => {
    if (anchor instanceof Element) {
      const r = anchor.getBoundingClientRect();
      if (direction === 'down') return { x: r.left + r.width / 2, y: r.bottom };
      if (direction === 'left') return { x: r.left, y: r.top + r.height / 2 };
      if (direction === 'right') return { x: r.right, y: r.top + r.height / 2 };
      if (direction === 'up') return { x: r.left + r.width / 2, y: r.top };
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
    if (anchor && typeof anchor.x === 'number') {
      return { x: anchor.x, y: anchor.y };
    }
    return { x: 0, y: 0 };
  };

  const looksLikeOptions = (v) =>
    v && typeof v === 'object' && !(v instanceof Element) && typeof v.x !== 'number';

  window.showTooltip = (props, arg2, arg3) => {
    if (window.__dndDragging) return;
    detach();

    let options;
    let anchor;
    if (looksLikeOptions(arg2)) {
      options = arg2;
      anchor = arg3;
    } else {
      anchor = arg2;
      options = arg3;
    }
    if (!anchor && typeof window.event === 'object' && window.event !== null) {
      anchor = window.event.currentTarget;
    }

    const opts = options || {};
    const direction = opts.direction || null;
    const lock = !!opts.lock;
    const persist = !!opts.persist;
    const target = anchorPoint(anchor, direction);

    let x = target.x;
    let y = target.y;
    if (!lock && anchor && typeof anchor.clientX === 'number') {
      x = anchor.clientX;
      y = anchor.clientY;
    }

      x,
      y,
      targetX: target.x,
      targetY: target.y,
      visible: true,
      props: props || {},
      direction: direction || 'none',
      lock,
      persist,
      compareSide: target.x < window.innerWidth / 2 ? 'compare-right' : 'compare-left',

  // (modal closed, row re-rendered) would orphan its tooltip. Every removal in

  $.on('afterUpdate', () => {

  });

  let bodyLeft = 0;
  let bodyTop = 0;

  const setCut = (clientX, clientY) => {
    const body = document.querySelector('tooltip-body[cramped]');
    if (!body) return;
    body.style.setProperty('--cut-x', `${clientX - bodyLeft}px`);
    body.style.setProperty('--cut-y', `${clientY - bodyTop}px`);

  document.addEventListener('mousemove', (e) => {

  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

  const positionTooltip = () => {
    if (!$.tooltip?.visible) return;
    const body = document.querySelector('tooltip-body');
    if (!body) return;

    const r = body.getBoundingClientRect();
    const w = r.width;
    const h = r.height;
    if (w === 0 || h === 0) return;

    const main = body.querySelector('tooltip-main') || body;
    const mr = main.getBoundingClientRect();
    const mw = mr.width;
    const mh = mr.height;
    const offX = mr.left - r.left;
    const offY = mr.top - r.top;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const fy = $.tooltip.y;

    } else if (dir === 'down') {

    } else if (dir === 'left') {

      mainTop = fy - mh / 2;
    } else if (dir === 'right') {

      mainTop = fy - mh / 2;

    const cramped = dir === 'left' || dir === 'right' ? vpLeft !== idealLeft : vpTop !== idealTop;

    const body = document.querySelector('tooltip-body');
