<card-hand flipped="@[flipped]" dim-unselected="@[dimUnselected]">
  <card-fan style="--angle: @[angle]deg; --distance: @[distance]px; --size: @[size]px">
    <!-- each cards as card (card.id), i -->
      <card-slot
        data-card-id="@[card.id]"
        selected="@[card.selected]"
        style="--i: @[i]; --n: @[cards.length]"
      >
        <component
          src="/components/remote/CardDisc.html"
          image="@[card.image]"
          x="@[card.x]"
          y="@[card.y]"
          zoom="@[zoom]"
          name="@[card.name]"
        >
        </component>
      </card-slot>
    <!-- /each -->
  </card-fan>
</card-hand>

<style>
  card-hand {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
  }

  card-fan {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  card-slot {
    pointer-events: auto;
    --rot: calc((var(--i, 0) - (var(--n, 1) - 1) / 2) * var(--angle, 8deg));
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--size, 110px);
    height: var(--size, 110px);
    transform-origin: 50% calc(50% + var(--distance, 320px));
    transform: translate(-50%, -50%) rotate(var(--rot));
    transition: transform 350ms cubic-bezier(0.02, 1.35, 0.53, 1);
    animation: card-deal 350ms cubic-bezier(0.02, 1.35, 0.53, 1) both;
  }

  card-hand:not([flipped]) card-disc {
    cursor: pointer;
  }

  card-hand:not([flipped]) card-slot:hover {
    z-index: 1;
  }

  card-hand:not([flipped]) card-disc:hover {
    transform: rotate(calc(-1 * var(--rot))) scale(1.22);
    box-shadow:
      inset 0 0 0 calc(var(--unit) * 0.75) var(--sheen-1),
      inset 0 0 0 calc(var(--unit) * 0.5) var(--gold-deep),
      0 calc(var(--unit) * 2.5) calc(var(--unit) * 5) calc(var(--unit) * -1) var(--scrim-3),
      0 0 0 calc(var(--unit) * 0.75) oklch(from var(--gold-warm) l c h / 0.55);
  }

  card-hand:not([flipped]) card-disc:active {
    transform: rotate(calc(-1 * var(--rot))) scale(1.08);
    transition-duration: 60ms;
  }

  card-hand[flipped] card-disc {
    filter: grayscale(0.85);
    opacity: 0.5;
  }

  card-hand[dim-unselected] card-slot:not([selected]) card-disc {
    filter: grayscale(0.85);
    opacity: 0.5;
  }

  card-slot[selected] card-disc {
    transform: rotate(calc(-1 * var(--rot))) scale(1.22);
    box-shadow:
      inset 0 0 0 calc(var(--unit) * 0.75) var(--sheen-1),
      inset 0 0 0 calc(var(--unit) * 0.5) var(--gold-deep),
      0 calc(var(--unit) * 2.5) calc(var(--unit) * 5) calc(var(--unit) * -1) var(--scrim-3),
      0 0 0 calc(var(--unit) * 0.75) oklch(from var(--gold-warm) l c h / 0.55);
  }

  @keyframes card-deal {
    from {
      opacity: 0;
      scale: 0.6;
    }
    to {
      opacity: 1;
      scale: 1;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    card-slot {
      animation: none;
      transition: none;
    }
  }
</style>
