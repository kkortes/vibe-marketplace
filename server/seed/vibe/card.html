<game-card data-type="@[type]" data-color="@[color]" data-icon="@[icon]" data-rarity="@[rarity]">
  <card-blend>
    <card-stack>
      <card-frame>
        <interior-frame>
          <interior>
            <inner-plate>
              <inner-frame>
                <!-- if icon !== 'none' -->
                <big-circle-border></big-circle-border>
                <!-- /if -->
              </inner-frame>
            </inner-plate>

            <card-content>
              <card-art>
                <!-- if icon !== 'none' && type !== 'god' -->
                <big-circle-mask></big-circle-mask>
                <!-- /if -->
                <card-image style="background-image: url('@[image]')">
                  <!-- if type === 'god' -->
                  <card-shade>
                    <card-caption>
                      <card-text-box>
                        <card-pills>
                          <card-pill type><pill-text>@[type]</pill-text></card-pill>
                          <!-- each subtypes as subtype -->
                          <card-pill subtype><pill-text>@[subtype]</pill-text></card-pill>
                          <!-- /each -->
                        </card-pills>
                        <!-- if keywords.length || text || flavourText -->
                        <card-body>
                          <!-- if keywords.length -->
                          <keyword-row>
                            <!-- each keywords as keyword -->
                            <card-pill><pill-text data-keyword="@[keyword]">@[keyword]</pill-text></card-pill>
                            <!-- /each -->
                          </keyword-row>
                          <!-- /if -->
                          <!-- if text -->
                          <card-rules>@[$.unsafe(text)]</card-rules>
                          <!-- /if -->
                          <!-- if text && flavourText -->
                          <br />
                          <!-- /if -->
                          <!-- if flavourText -->
                          <card-flavour>@[$.unsafe(flavourText)]</card-flavour>
                          <!-- /if -->
                        </card-body>
                        <!-- /if -->
                      </card-text-box>
                    </card-caption>
                  </card-shade>
                  <!-- /if -->
                  <!-- if damage || health -->
                  <card-stats>
                    <stats-plate>
                      <span>@[[damage, health].filter(Boolean).join('/')]</span>
                    </stats-plate>
                  </card-stats>
                  <!-- /if -->
                </card-image>
                <!-- if type !== 'god' -->
                <stripe top></stripe>
                <stripe left></stripe>
                <stripe right></stripe>
                <!-- /if -->
              </card-art>

              <!-- if type !== 'god' -->
              <card-text-box>
                <card-pills>
                  <card-pill type><pill-text>@[type]</pill-text></card-pill>
                  <!-- each subtypes as subtype -->
                  <card-pill subtype><pill-text>@[subtype]</pill-text></card-pill>
                  <!-- /each -->
                </card-pills>
                <!-- if keywords.length || text || flavourText -->
                <card-body>
                  <!-- if keywords.length -->
                  <keyword-row>
                    <!-- each keywords as keyword -->
                    <card-pill><pill-text data-keyword="@[keyword]">@[keyword]</pill-text></card-pill>
                    <!-- /each -->
                  </keyword-row>
                  <!-- /if -->
                  <!-- if text -->
                  <card-rules>@[$.unsafe(text)]</card-rules>
                  <!-- /if -->
                  <!-- if text && flavourText -->
                  <br />
                  <!-- /if -->
                  <!-- if flavourText -->
                  <card-flavour>@[$.unsafe(flavourText)]</card-flavour>
                  <!-- /if -->
                </card-body>
                <!-- /if -->
              </card-text-box>
              <!-- /if -->
            </card-content>

            <inner-plate>
              <inner-frame clear>
                <!-- if type !== 'god' -->
                <circle-border top right></circle-border>
                <circle-border top left></circle-border>
                <circle-border bottom left></circle-border>
                <circle-border bottom right></circle-border>
                <!-- /if -->
                <card-name>
                  <name-shadow><span>@[$.unsafe(name)]</span></name-shadow>
                </card-name>
              </inner-frame>
            </inner-plate>

            <!-- if type !== 'god' -->
            <circle-mask top right></circle-mask>
            <circle-mask top left></circle-mask>
            <circle-mask bottom left></circle-mask>
            <circle-mask bottom right></circle-mask>
            <!-- /if -->
          </interior>

          <!-- if icon !== 'none' && type !== 'god' -->
          <big-circle-border></big-circle-border>
          <!-- /if -->

          <!-- if type !== 'god' -->
          <corner-circle top right></corner-circle>
          <corner-circle top left></corner-circle>
          <corner-circle bottom left></corner-circle>
          <corner-circle bottom right></corner-circle>
          <!-- /if -->
        </interior-frame>
      </card-frame>

      <!-- if icon !== 'none' && type !== 'god' -->
      <big-circle-mask></big-circle-mask>
      <!-- /if -->

      <!-- if type !== 'god' -->
      <circle-mask top right></circle-mask>
      <circle-mask top left></circle-mask>
      <circle-mask bottom left></circle-mask>
      <circle-mask bottom right></circle-mask>
      <!-- /if -->

      <card-emblem>
        <card-icon style="--icon: var(--icon-plant)"></card-icon>
      </card-emblem>

      <card-rarity style="--level: @[rarity]">
        <rarity-backdrop>
          <rarity-silhouette>
            <rarity-shape data-shape="hexagon"></rarity-shape>
            <rarity-shape data-shape="pentagon"></rarity-shape>
            <rarity-shape data-shape="square"></rarity-shape>
            <rarity-shape data-shape="triangle"></rarity-shape>
          </rarity-silhouette>
        </rarity-backdrop>
        <!-- each [0, 1, 2, 3] as i -->
        <rarity-shape data-shape="@[['triangle', 'square', 'pentagon', 'hexagon'][(i + 5 - rarity) % 4]]" style="--darkness: @[0.4 + i * 0.2]"></rarity-shape>
        <!-- /each -->
      </card-rarity>

      <!-- if icon !== 'none' -->
      <circle-mana>
        <!-- if cost -->
        <span>@[cost]</span>
        <!-- else -->
        <card-icon style="--icon: var(--icon-@[icon])"></card-icon>
        <!-- /if -->
      </circle-mana>
      <!-- /if -->

      <card-credits>
        <span>@[serial]</span>
        <span><card-icon style="--icon: var(--icon-quill)"></card-icon>@[artist]</span>
      </card-credits>
    </card-stack>
  </card-blend>
</game-card>

    *,
    ::before,
    ::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0 solid;
    }

    card-blend {
      display: grid;
      width: 100%;
      height: 100%;
      mix-blend-mode: multiply;
    }

    card-stack,
    interior {
      display: grid;
      grid-area: 1 / 1;
    }

    card-frame {
      display: grid;
      grid-area: 1 / 1;
      aspect-ratio: 0.714 / 1;
      padding: 0.75rem;
      border-radius: 0.75rem;
      background-image: var(--radial);
    }

    interior-frame {
      position: relative;
      grid-area: 1 / 1;
      overflow: hidden;
      border: 2px solid var(--c-800);
      border-radius: 0.25rem;
      background-color: var(--c-600);
    }

    inner-plate {
      display: grid;
      grid-area: 1 / 1;
      aspect-ratio: 0.694 / 1;
      padding: 0.25rem;
      border-radius: 0.75rem;
    }

    inner-frame {
      position: relative;
      grid-area: 1 / 1;
      overflow: hidden;
